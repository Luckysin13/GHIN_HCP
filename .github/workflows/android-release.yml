name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Determine release tag
        id: release
        run: |
          tag="${GITHUB_REF_NAME%-publish}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "GHIN-HCP-${RELEASE_TAG}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" "GHIN-HCP-${RELEASE_TAG}.apk" --title "GHIN HCP $RELEASE_TAG" --generate-notes
